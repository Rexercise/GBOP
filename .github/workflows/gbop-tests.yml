name: GBOP tests

on:
  push:
  pull_request:

jobs:
  snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile changed Python
        run: python -m py_compile bot.py gbop_voice_web/snapshots.py
      - name: Run snapshot tests
        run: python -m unittest tests.test_snapshots
