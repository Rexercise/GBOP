name: GBOP tests

on:
  push:
  pull_request:

jobs:
  snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: pip install httpx==0.28.1
      - name: Compile changed Python
        run: >-
          python -m py_compile
          bot.py
          gbop_voice_web/server.py
          gbop_voice_web/snapshots.py
          gbop_voice_web/member_intelligence.py
          gbop_voice_web/trade_assist.py
          gbop_voice_web/forex_news.py
      - name: Run regression tests
        run: python -m unittest tests.test_snapshots tests.test_member_intelligence tests.test_trade_assist tests.test_forex_news
