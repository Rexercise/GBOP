name: GBOP tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: pip install httpx==0.28.1 fastapi==0.116.1 discord.py==2.7.1
      - name: Compile changed Python
        run: >-
          python -m py_compile
          bot.py
          gbop_voice_web/server.py
          gbop_voice_web/member_access.py
          gbop_voice_web/voice_policy.py
          gbop_voice_web/snapshots.py
          gbop_voice_web/member_intelligence.py
          gbop_voice_web/trade_assist.py
          gbop_voice_web/forex_news.py
          gbop_voice_web/market_data.py
          gbop_voice_web/market_routes.py
          market_bridge/bridge.py
      - name: Run regression tests
        run: python -m unittest discover -s tests
