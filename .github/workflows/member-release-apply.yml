name: Apply audited member release
on:
  push:
    branches: [codex/member-readiness-20261003]
    paths: [.github/workflows/member-release-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Rexercise/GBOP' && github.ref == 'refs/heads/codex/member-readiness-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx==0.28.1 fastapi==0.116.1
      - name: Apply exact source changes with before and after blob checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          def blob(s):
              b=s.encode()
              return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\x00'+b).hexdigest()
          def replace(s, old, new):
              assert s.count(old)==1, 'Expected exactly one source match'
              return s.replace(old,new,1)
          p=Path('bot.py'); s=p.read_text()
          assert blob(s)=='9aded211b5986bc3e2d43dc7b44c109845bf124c'
          s=replace(s,'from db_compat import db\n','from db_compat import db\nfrom gbop_voice_web.member_access import member_access_error\nfrom gbop_voice_web.voice_policy import build_voice_instructions\n')
          s=replace(s,'def ai_execute_tool(user_id: int, name: str, args: dict):\n','def ai_execute_tool(user_id: int, name: str, args: dict):\n    denial = member_access_error(db, GTOP_GUILD_ID, user_id, GTOP_OWNER_USER_ID)\n    if denial:\n        return {"ok": False, "error": denial}\n')
          start=s.index('    def instructions(self):',s.index('class GBOPRealtimeSession:'))
          end=s.index('    def session_update(self):',start)
          s=s[:start]+'''    def instructions(self):
              # Do not pin journal prose/history in every voice response. All current
              # records remain available through the unchanged member-scoped tools.
              profile = get_profile(db, GTOP_GUILD_ID, self.member.id)
              member_state = market_clock() + "\\n" + profile_context(profile)
              return build_voice_instructions(CANONICAL_KNOWLEDGE, MARKET_PROMPT, member_state)

          '''+s[end:]
          s=replace(s,'os.getenv("GBOP_REALTIME_MAX_OUTPUT_TOKENS", "700")','os.getenv("GBOP_REALTIME_MAX_OUTPUT_TOKENS", "1400")')
          s=replace(s,'GBOP_REALTIME_MAX_OUTPUT_TOKENS = 700','GBOP_REALTIME_MAX_OUTPUT_TOKENS = 1400')
          s=replace(s,'os.getenv("GBOP_VAD_EAGERNESS", "high")','os.getenv("GBOP_VAD_EAGERNESS", "medium")')
          s=replace(s,'GBOP_VAD_EAGERNESS = "high"','GBOP_VAD_EAGERNESS = "medium"')
          old='                update = await asyncio.to_thread(self.session_update)\n'
          s=replace(s,old,old+'''                print("[GBOP-VOICE-POLICY] compact-v1 instructions_chars=",
                                len(update["session"]["instructions"]), "tools=", len(update["session"]["tools"]),
                                "max_output_tokens=", GBOP_REALTIME_MAX_OUTPUT_TOKENS,
                                "vad_eagerness=", GBOP_VAD_EAGERNESS)
          ''')
          assert blob(s)=='d98aa4809455546264c81a06a3e55fc95ac6f8d6', 'Patched bot differs from locally tested source'
          p.write_text(s)
          p=Path('gbop_voice_web/server.py'); s=p.read_text()
          assert blob(s)=='a63c4fc779a76e84ef200f8a46d96130a3bfe1ca'
          s=replace(s,'from db_compat import db\n','from db_compat import db\nfrom gbop_voice_web.member_access import member_access_error\n')
          s=replace(s,'    return await _refresh_member_session(sid, session)\n','''    session = await _refresh_member_session(sid, session)
              # Check the persistent GBOP gate on every protected request, not just login
              # or the cached Discord role check. Revocation applies across interfaces.
              denial = await asyncio.to_thread(
                  member_access_error, db, GTOP_GUILD_ID, int(session["user_id"]), OWNER_USER_ID
              )
              if denial:
                  AUTH_SESSIONS.pop(sid, None)
                  raise HTTPException(status_code=403, detail=denial)
              return session
          ''')
          old='def run_tool(user_id: int, name: str, args: dict, confirmation_token=None):\n'
          s=replace(s,old,old+'''    # A request may span multiple AI calls. Recheck before each read/write so
              # revocation during an in-flight conversation cannot authorize later actions.
              denial = member_access_error(db, GTOP_GUILD_ID, user_id, OWNER_USER_ID)
              if denial:
                  return {"ok": False, "error": denial}
          ''')
          assert blob(s)=='f4854554b96e47a449aaf0efb2d4d261e5048f01', 'Patched server differs from locally tested source'
          p.write_text(s)
          PY
      - name: Compile and test patched source
        run: |
          python -m py_compile bot.py gbop_voice_web/server.py gbop_voice_web/member_access.py gbop_voice_web/voice_policy.py
          python -m unittest discover -s tests
      - name: Commit only tested runtime files to the same release branch
        run: |
          test "$(git ls-remote origin refs/heads/codex/member-readiness-20261003 | cut -f1)" = "$GITHUB_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- bot.py gbop_voice_web/server.py
          git diff --cached --stat
          git commit -m 'Enforce member access on every transport and streamline Discord voice'
          git push origin HEAD:refs/heads/codex/member-readiness-20261003
