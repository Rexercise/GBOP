name: GBOP verified repair
on:
  push:
    branches: [fix/paired-smt-journal-recovery]
    paths: [.github/workflows/gbop-apply-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'Rexercise/GBOP' && github.ref == 'refs/heads/fix/paired-smt-journal-recovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and apply exact locally tested patch
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          root = pathlib.Path('.github/repair-payload')
          encoded = ''.join((root / f'part{i}.b64').read_text().strip() for i in range(1,5))
          data = gzip.decompress(base64.b64decode(encoded, validate=True))
          expected = '5a171ff7623c577f032838f282c7ed65619796f4a8c99c612b3a1b297ea14080'
          assert hashlib.sha256(data).hexdigest() == expected, 'Patch integrity check failed'
          path = pathlib.Path('/tmp/gbop-repair.patch')
          path.write_bytes(data)
          args = ['git','apply','--exclude=.github/workflows/gbop-repair-workspace.yml']
          subprocess.run(args + ['--check',str(path)],check=True)
          subprocess.run(args + [str(path)],check=True)
          PY
      - name: Install existing test dependencies
        run: pip install httpx==0.28.1 fastapi==0.116.1
      - name: Compile and run complete regression suite
        run: |
          set -euo pipefail
          python -m py_compile bot.py gbop_voice_web/*.py
          python -m unittest discover -s tests 2>&1 | tee /tmp/gbop-repair-tests.txt
          git diff --check
      - name: Commit tested application changes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py gbop_voice_web/journal_recall.py gbop_voice_web/market_data.py gbop_voice_web/server.py gbop_voice_web/smt_evidence.py gbop_voice_web/voice_policy.py gbop_voice_web/voice_runtime.py tests/test_member_readiness.py tests/test_smt_and_journal_recovery.py
          git commit -m 'Fix paired SMT evidence and member journal retrieval during voice recovery'
          git push origin HEAD:refs/heads/fix/paired-smt-journal-recovery
          git rev-parse HEAD | tee /tmp/gbop-repair-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gbop-repair-verification
          path: |
            /tmp/gbop-repair-tests.txt
            /tmp/gbop-repair-commit.txt
          retention-days: 3
