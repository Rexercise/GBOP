name: TAB release validation
on:
  push:
    branches: [fix/tab-market-release-20261003]
permissions:
  contents: write
concurrency:
  group: tab-release-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install httpx==0.28.1 fastapi==0.116.1
      - name: Apply exact branch-only integration patch
        run: |
          python tools/apply_tab_release.py
          python - <<'PY'
          from pathlib import Path
          p=Path('gbop_voice_web/market_watch.py'); t=p.read_text()
          start=t.index('For Super Soup, use classification.formation')
          end=t.index("'''",start)
          t=t[:start]+'Super Soup: read formation, outcome and parent-range function separately.\n'+t[end:]
          p.write_text(t)
          PY
          python tools/tab_release_refinements.py
          python - <<'PY'
          from pathlib import Path
          p=Path('market_bridge/bridge.py'); t=p.read_text()
          assert "ASSETS = {'NAS100', 'US30'" in t
          t=t.replace("ASSETS = {'NAS100', 'US30'", "ASSETS = {'NAS100', 'SPX', 'US30'")
          t=t.replace('not 1 <= len(symbols) <= 8', 'not 1 <= len(symbols) <= len(ASSETS)')
          t=t.replace('Configure 1–8 exact broker symbols.', 'Configure 1–9 exact broker symbols, including SPX only with its verified broker mapping.')
          p.write_text(t)
          p=Path('gbop_voice_web/market_watch_runtime.py'); t=p.read_text()
          start=t.index('    jobs=[]\n',t.index('def prepare_next_shift('))
          end=t.index("    result=market_tool(db,'review_market_session'",start)
          replacement='''    candidates=sorted(((fingerprints.get(('rotation',a,s),0),a,s) for a in assets for s in ('day','night')),key=lambda x:x[0])
              selected=None
              for _,asset,shift in candidates[:3]:
                  fingerprints[('rotation',asset,shift)]=now
                  feed=read_feed(db,asset,now)
                  if not feed.get('ok'):
                      continue
                  try:
                      day=latest_available_shift_date(feed,shift,db)
                  except ValueError:
                      continue
                  begins=datetime.fromisoformat(day).replace(hour=7 if shift=='day' else 19,tzinfo=NY)
                  start=int(begins.timestamp()); end=int((begins+timedelta(hours=5)).timestamp())
                  bars,step=history_bars(db,feed,start,end)
                  if not bars:
                      continue
                  key=(asset,day,shift)
                  token=(asset,day,shift,hashlib.sha256(json.dumps(bars,separators=(',',':')).encode()).hexdigest(),now//300)
                  if fingerprints.get(key)==token:
                      continue
                  selected=(asset,day,shift,token)
                  break
              if selected is None:
                  return None
              asset,day,shift,token=selected
          '''
          import textwrap
          replacement='    '+textwrap.dedent(replacement[4:]).replace('\n          ','\n') if False else replacement
          # YAML block indentation leaves ten extra spaces on continuation lines.
          lines=replacement.splitlines()
          replacement=lines[0]+'\n'+'\n'.join(line[10:] if line.startswith('          ') else line for line in lines[1:])+'\n'
          t=t[:start]+replacement+t[end:]
          p.write_text(t)
          with Path('gbop_voice_web/TAB_RELEASE.md').open('a') as f:
              f.write('\nSPX collector support is included in this source release, but changing the hosted bot does not update the separate Windows collector or its config.json. SPX availability must be confirmed from received broker history; no substitute symbol is invented.\n')
          PY
      - name: Compile and run full regression suite
        run: |
          python -m compileall -q bot.py gbop_voice_web market_bridge
          python -m unittest discover -s tests
      - name: Commit validated integration and remove temporary workflow
        run: |
          rm tools/apply_tab_release.py tools/tab_release_refinements.py .github/workflows/tab-release-validation.yml
          git add bot.py gbop_voice_web market_bridge tests tools/apply_tab_release.py tools/tab_release_refinements.py .github/workflows/tab-release-validation.yml
          git -c user.name='GBOP release validation' -c user.email='noreply@github.com' commit -m 'Apply validated TAB integration and remove release helpers'
          git push origin HEAD:fix/tab-market-release-20261003
