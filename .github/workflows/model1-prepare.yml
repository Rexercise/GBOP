name: Prepare isolated Model 1 correction
on:
  push:
    branches: [fix/model1-identity-0740-isolated]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/model1-identity-0740-isolated
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact market-policy corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace_once(text, old, new):
              assert text.count(old) == 1, f'Expected exactly one match: {old!r}'
              return text.replace(old, new, 1)
          path = Path('gbop_voice_web/gtop_knowledge.txt')
          text = replace_once(path.read_text(), 'get_crt_review or get_candle_data', 'review_market_crt or inspect_market_candles')
          path.write_text(text)
          path = Path('gbop_voice_web/market_data.py')
          text = path.read_text()
          text = replace_once(text,
              'Same-bar touches have unknown order. M5 purge-body crosses are not by themselves\nconfirmed Model 1/CSD or Super Soup. Query the selected candidate candles as needed.',
              'Same-bar touches have unknown order. Use ranges[].model1 (or review.model1)\nto identify the qualifying body-purging Model 1 candle on the assigned timeframe.\nThat candle IS Model 1, regardless of later CSD confirmation or failure. It is not\na candidate. Answer its open/close time, OHLC and purged range/level first.\nThe older m5_body_evidence describes a later body cross, not initial formation.\nCSD confirmation, Super Soup occurrence and actual execution are separate questions.\nentry_confirmed=false never negates an identified Model 1 candle. Inspect later\nassigned-timeframe candles for CSD/Super Soup; not_assessed means unverified, not absent.')
          text = replace_once(text,
              "Range candidates alone are not confirmed CSD, Super Soup, Blessed Thief entries, signals,\nor evidence of an actual member execution. Examine assigned-timeframe candles and the\nmember's selected Model 1 candidate before discussing a possible Super Soup/CSD; if the\nbody or sequence is unclear, ask for its candle instead of asserting confirmation.",
              'A qualifying assigned-timeframe body purge identifies the Model 1 candle without\nrequiring later CSD, Super Soup, distribution or trader execution. Preserve this\nidentity even when the setup later fails. Use review_market_crt and\ninspect_market_candles to answer questions about that specific candle and its later\nprice sequence. A market pattern is not proof of a member fill. Missing source\ncandles mean unverified, not that a Model 1 or Super Soup did not occur.')
          text = replace_once(text,
              'Preserve missing-data and same-bar uncertainty; body-cross evidence is not an entry.',
              'Preserve missing-data and same-bar uncertainty; market evidence is not a member entry.\nThe qualifying body-purging candle IS the Model 1 candle, not a candidate.\nFor questions about that candle, delegate to the backend and preserve its\nmodel1.candles identification, timestamps, OHLC and purged level. Later CSD,\nSuper Soup occurrence and actual execution are independent; unassessed is not absent.')
          text = replace_once(text,
              'Returns assigned timeframe candles and bar timestamps; not an automatic entry signal.',
              'Returns identified body-purging Model 1 candles, assigned timeframe candles and bar timestamps; candle identity is independent of later CSD or execution.')
          path.write_text(text)
          PY
      - name: Install existing test dependencies
        run: pip install httpx==0.28.1 fastapi==0.116.1
      - name: Validate compile, patch and all regression tests
        run: |
          git diff --check
          python -m compileall -q gbop_voice_web bot.py
          python -m unittest discover -s tests
      - name: Commit tested policy and remove one-time preparation workflow
        run: |
          rm .github/workflows/model1-prepare.yml
          git config user.name 'GBOP maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gbop_voice_web/gtop_knowledge.txt gbop_voice_web/market_data.py .github/workflows/model1-prepare.yml
          git commit -m 'fix(policy): align market and voice Model 1 identity with shared canon'
          git push origin HEAD:fix/model1-identity-0740-isolated
