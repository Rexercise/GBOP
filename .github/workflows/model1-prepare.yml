name: Prepare isolated Model 1 correction
on:
  push:
    branches: [fix/model1-identity-0740-isolated]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/model1-identity-0740-isolated
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact knowledge, market-policy and voice-format corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace_once(text, old, new):
              assert text.count(old) == 1, f'Expected exactly one match: {old!r}'
              return text.replace(old, new, 1)
          path = Path('gbop_voice_web/gtop_knowledge.txt')
          text = path.read_text()
          start = text.index('MODEL 1 CANDLE / BODY-CLOSE LOGIC')
          end = text.index('\nBREAKER BLOCK\n', start)
          block = '''MODEL 1 CANDLE / BODY-CLOSE LOGIC — CORRECTED 3 OCTOBER 2026
          [GTOP REFINEMENT]
          The qualifying body-purging candle on the selected range's assigned timeframe IS the Model 1 candle, not a candidate. Its real body crosses and closes through the range boundary. H1 uses M5: bearish above the high; bullish below the low. Wick-only, forming or incomplete candles do not establish that body close.
          The candle remains Model 1 whether later CSD confirms, stays unconfirmed or the setup fails.

          SUBSEQUENT EVENTS
          [GTOP EXCLUSIVE / GTOP REFINEMENT]
          Super Soup = Turtle Soup of this Model 1 candle on the same assigned timeframe BEFORE CSD.
          [GTOP REFINEMENT]
          CSD/CISD confirms when price closes through the OTHER SIDE of that candle's liquidity. This activates its confirmed function, not its identity.

          MODEL 1 RESPONSE CONTRACT
          Answer "the Model 1" with the candle first: open/close times, OHLC, purged range/side/level. Use review_market_crt or inspect_market_candles. model1.candles identifies body purges; m5_body_evidence describes a separate LATER body cross. Preserve candle precision and identify multiple qualifying candles without inventing one winner.
          Keep formation, CSD, Super Soup occurrence and trader execution separate. entry_confirmed=false negates none of the observed candle facts. No execution record does not mean no Super Soup; inspect later assigned candles to assess its sequence.
          Missing data means unverified, not absent. not_assessed is not a negative result. Later failure never erases prior formation. Correct obsolete mislabels directly.
          '''
          text = text[:start] + block + text[end:]
          text = replace_once(text,
              "Turtle Body Soup / Model 1 is the Tier 2 entry classification. The qualifying candle on the assigned timeframe whose real body crosses and closes through the selected range's liquidity IS the Model 1 candle. It is not a candidate.",
              'Turtle Body Soup / Model 1 is Tier 2. The qualifying assigned-timeframe body-purging candle IS Model 1, not a candidate.')
          text = replace_once(text,
              'Model 1 candle identification is separate from subsequent CSD/CISD confirmation. A Model 1 candle remains the Model 1 candle whether CSD later confirms, remains unconfirmed, or the setup fails. After the purge, assess the later close back through the body / change in state of delivery separately.',
              'Model 1 candle identity is independent of later confirmation or failure. Assess the later close back through the body / CSD separately.')
          path.write_text(text)
          path = Path('gbop_voice_web/market_data.py')
          text = path.read_text()
          text = replace_once(text,
              'Same-bar touches have unknown order. M5 purge-body crosses are not by themselves\nconfirmed Model 1/CSD or Super Soup. Query the selected candidate candles as needed.',
              'Same-bar touches have unknown order. model1.candles identifies the qualifying\nassigned-timeframe body-purging Model 1 candle, not a candidate.\nentry_confirmed=false never negates an identified Model 1 candle.\nCSD, Super Soup occurrence and actual execution are separate; unassessed is not absent.')
          text = replace_once(text,
              "Range candidates alone are not confirmed CSD, Super Soup, Blessed Thief entries, signals,\nor evidence of an actual member execution. Examine assigned-timeframe candles and the\nmember's selected Model 1 candidate before discussing a possible Super Soup/CSD; if the\nbody or sequence is unclear, ask for its candle instead of asserting confirmation.",
              'Answer Model 1 candle questions with its time, OHLC and purged level first.\nUse review_market_crt/inspect_market_candles for its later CSD/Super Soup sequence.\nMissing data does not establish absence. Later failure does not erase candle identity.\nNo price pattern proves a member execution.')
          text = replace_once(text,
              'Preserve missing-data and same-bar uncertainty; body-cross evidence is not an entry.',
              'Preserve missing-data and same-bar uncertainty. Preserve backend model1.candles identification:\nthe body-purging candle IS Model 1, not a candidate, independently of later CSD,\nSuper Soup or execution. Unassessed does not mean absent.')
          text = replace_once(text,
              'Returns assigned timeframe candles and bar timestamps; not an automatic entry signal.',
              'Returns identified Model 1 body-purging candles and assigned timeframe bars; formation is independent of CSD/execution.')
          path.write_text(text)
          path = Path('gbop_voice_web/candle_evidence.py')
          text = replace_once(path.read_text(),
              "'bar_open_ny': candle['start_ny'], 'bar_close_ny': candle['end_ny'],",
              "'start_ny': candle['start_ny'], 'end_ny': candle['end_ny'],\n                    'bar_open_ny': candle['start_ny'], 'bar_close_ny': candle['end_ny'],")
          path.write_text(text)
          PY
      - name: Install existing test dependencies
        run: pip install httpx==0.28.1 fastapi==0.116.1
      - name: Validate compile, patch and all regression tests
        run: |
          git diff --check
          python -m compileall -q gbop_voice_web bot.py
          python -m unittest discover -s tests
      - name: Commit tested corrections on isolated branch only
        run: |
          git config user.name 'GBOP maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gbop_voice_web/gtop_knowledge.txt gbop_voice_web/market_data.py gbop_voice_web/candle_evidence.py
          git commit -m 'fix(policy): align market and voice Model 1 identity with shared canon'
          git push origin HEAD:fix/model1-identity-0740-isolated
