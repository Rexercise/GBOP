name: Reconcile SMT reference with current canon
on:
  push:
    branches: [fix/candle-labels-smt-reference-20261003]
    paths: [.github/workflows/reconcile-smt-reference.yml]
permissions:
  contents: write
jobs:
  reconcile-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/candle-labels-smt-reference-20261003
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx==0.28.1 fastapi==0.116.1
      - name: Reconcile only reviewed concurrent changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          import subprocess
          reviewed = '78e0a15a3383ba7fc5538a380be9fa4396e23a0a'
          result = subprocess.run(['git','merge','--no-commit','--no-ff',reviewed])
          conflicts = subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          allowed = {'gbop_voice_web/gtop_boneless.txt','gbop_voice_web/market_context.py'}
          assert result.returncode == 0 or (result.returncode == 1 and conflicts), result.returncode
          assert set(conflicts) <= allowed, conflicts
          # Keep the newer, fully reviewed owner canon and its exact evidence contracts.
          for name in allowed:
              Path(name).write_text(subprocess.check_output(['git','show',f'{reviewed}:{name}'],text=True))
          p = Path('gbop_voice_web/market_context.py'); text = p.read_text()
          old = "        text += ' These are paired market facts, not proof of a member execution.'"
          new = '\n'.join([
              "        identity = event.get('paired_model1', {})",
              "        if identity.get('status') == 'identified':",
              "            ref = identity['boneless_reference']",
              "            text += (f\" {ref['asset']}'s SMT-inherited Model 1 is its {ref['timeframe']} candle opening \"",
              "                     f\"{ref['bar_open_ny']}, matching {event['swept_asset']}'s body-purge candle. \"",
              "                     'This is a same-time reference, not a visible local purge or inherited CSD confirmation.')",
              old,
          ])
          assert text.count(old) == 1
          text = text.replace(old,new)
          old = 'Preserve the working chronology, Super Soup cleanliness and separate nested'
          new = ('Use paired_model1.boneless_reference when identified; it contains the verified same-time candle.\n'
                 'Lead with recap.paired_interpretation while preserving the local-only chronology.\n' + old)
          assert text.count(old) == 1
          p.write_text(text.replace(old,new))
          p = Path('gbop_voice_web/smt_reference.py'); text = p.read_text()
          old = "'identity_basis': 'same_time_as_correlated_body_purge',"
          new = "'identity_basis': 'smt_time_aligned',\n                'identity_detail': 'same_time_as_correlated_body_purge',"
          assert text.count(old) == 1
          p.write_text(text.replace(old,new))
          p = Path('tests/test_smt_reference.py'); text = p.read_text()
          old = "        self.assertFalse(r['boneless_reference']['local_purge_observed'])"
          new = old + "\n        self.assertEqual(r['boneless_reference']['identity_basis'], 'smt_time_aligned')"
          assert text.count(old) == 1
          p.write_text(text.replace(old,new))
          subprocess.run(['git','add',*sorted(allowed),'gbop_voice_web/smt_reference.py','tests/test_smt_reference.py'],check=True)
          assert not subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).strip()
          PY
      - name: Compile and test the combined release tree
        shell: bash
        run: |
          python -m compileall -q gbop_voice_web tests
          python -m unittest discover -s tests 2>&1 | tee /tmp/gbop-reconciled-tests.log
      - name: Commit validated reconciliation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/reconcile-smt-reference.yml
          git add .github/workflows/reconcile-smt-reference.yml
          git diff --cached --stat
          git commit -m 'Reconcile latest GTOP canon with verified same-time SMT candle evidence'
          git push origin HEAD:fix/candle-labels-smt-reference-20261003
