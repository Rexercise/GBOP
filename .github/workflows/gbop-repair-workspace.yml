name: GBOP repair workspace
on:
  push:
    branches: [fix/paired-smt-journal-recovery]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package tracked source only
        run: git archive --format=tar HEAD > /tmp/gbop-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: gbop-repair-source
          path: /tmp/gbop-source.tar
          retention-days: 1
